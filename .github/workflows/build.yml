# Builds Tuner on GitHub every time you push.
#  - Every push: runs the tests and builds app-release.apk (download it from the run's "Artifacts").
#  - Push a tag like v5.4.1: also publishes a GitHub release with the APK, which Tuner's
#    Settings › Update Tuner › "Check now" can install on the TV.
#
# One-off set-up (see README › "Automatic builds on GitHub"): add your PC's debug key as the secret
# DEBUG_KEYSTORE_BASE64, so GitHub's APKs install over the ones you built yourself.
name: Build Flicker

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      KEYSTORE_B64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
      # Optional: your TMDB key, built in so film info works without typing it on the TV.
      TUNER_TMDB_KEY: ${{ secrets.TMDB_KEY }}
      # Optional: Google sign-in for "Sync between houses" (see README › Google Drive sync).
      TUNER_GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
      TUNER_GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
      # Optional: YouTube search (see README › YouTube).
      TUNER_YOUTUBE_KEY: ${{ secrets.YOUTUBE_KEY }}
      TUNER_OMDB_KEY: ${{ secrets.OMDB_KEY }}
      TUNER_TRAKT_ID: ${{ secrets.TRAKT_CLIENT_ID }}
      TUNER_TRAKT_SECRET: ${{ secrets.TRAKT_CLIENT_SECRET }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '8.11.1'

      - name: Use your signing key
        if: env.KEYSTORE_B64 != ''
        run: |
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/debug.keystore"
          echo "TUNER_KEYSTORE=$RUNNER_TEMP/debug.keystore" >> "$GITHUB_ENV"

      - name: Stop if a release would be signed with the wrong key
        if: startsWith(github.ref, 'refs/tags/v') && env.KEYSTORE_B64 == ''
        run: |
          echo "::error::Add the DEBUG_KEYSTORE_BASE64 secret first – otherwise the TV refuses the update."
          exit 1

      - name: Version from the tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: echo "TUNER_VERSION_NAME=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      # Maven Central sometimes turns GitHub away for a minute ("429 Too Many Requests").
      # Fetch everything first, and try again a couple of times if that happens.
      - name: Download libraries
        run: |
          for attempt in 1 2 3; do
            if gradle --no-daemon :app:dependencies > /dev/null; then exit 0; fi
            echo "Download failed (attempt $attempt) – waiting a minute and trying again"
            sleep 60
          done
          exit 1

      # The layout tests' Android (Robolectric, ~150 MB) is kept between runs.
      - name: Keep Robolectric's Android between runs
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository/org/robolectric
          key: robolectric-4.14.1-sdk34

      - name: Run the tests
        run: |
          # Robolectric fetches its Android from Maven Central the first time; if that's refused
          # for a moment, wait and try again rather than failing the build.
          for attempt in 1 2 3; do
            if gradle --no-daemon testDebugUnitTest > test.log 2>&1; then cat test.log; exit 0; fi
            cat test.log
            if ! grep -q "Failed to fetch maven artifact" test.log; then exit 1; fi
            echo "Robolectric's download was refused (attempt $attempt) – waiting a minute"
            sleep 60
          done
          exit 1

      - name: Build the APK
        run: gradle --no-daemon assembleRelease

      - name: Show the names needed to read a freeze report (temporary)
        run: |
          m=app/build/outputs/mapping/release/mapping.txt
          for c in I3.N3 I3.z1 s4.g t4.G b4.a; do
            echo "== $c"
            grep -n -- "-> $c:" $m || true
            n=$(grep -n -- "-> $c:" $m | head -1 | cut -d: -f1)
            [ -n "$n" ] && sed -n "$((n+1)),$((n+4000))p" $m | awk '/^[^ ]/{exit} {print}' | grep -E " (L4|I4|J4|q3|a|invokeSuspend|run|resumeWith)$|:(55|251|713|170|12|9|107):" | head -40
          done

      - name: Check the APK prepares Flicker's screens ahead (baseline profile)
        run: |
          unzip -l app/build/outputs/apk/release/app-release.apk | grep -E "assets/dexopt/baseline.prof" || { echo "The baseline profile is missing from the APK"; exit 1; }

      - name: Keep the APK (download from this run's Artifacts)
        uses: actions/upload-artifact@v5
        with:
          name: tuner-apk
          path: app/build/outputs/apk/release/*.apk

      - name: Keep the TV-size screen pictures from the layout tests
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: tv-screenshots
          path: app/build/outputs/roborazzi/
          if-no-files-found: ignore

      - name: Keep the test report if something failed
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: test-report
          path: app/build/reports/tests/

      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/release/app-release.apk
          generate_release_notes: true

  # Flicker for Windows: built on a Windows machine (installers can only be made there).
  # A separate build, so a problem here never stops the TV app.
  windows:
    needs: build
    runs-on: windows-latest
    env:
      # The same keys as the TV app (sync sign-in, film info, YouTube).
      TUNER_TMDB_KEY: ${{ secrets.TMDB_KEY }}
      TUNER_GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
      TUNER_GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
      TUNER_YOUTUBE_KEY: ${{ secrets.YOUTUBE_KEY }}
      TUNER_TRAKT_ID: ${{ secrets.TRAKT_CLIENT_ID }}
      TUNER_TRAKT_SECRET: ${{ secrets.TRAKT_CLIENT_SECRET }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '8.11.1'

      - name: Version from the tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: echo "TUNER_VERSION_NAME=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      # VLC's engine goes inside the installer, so the PC needs nothing else.
      - name: Bundle VLC
        shell: bash
        run: |
          set -e
          VLC=3.0.21
          curl -fsSL --retry 3 -o vlc.zip "https://get.videolan.org/vlc/$VLC/win64/vlc-$VLC-win64.zip" \
            || curl -fsSL --retry 3 -o vlc.zip "https://download.videolan.org/pub/videolan/vlc/$VLC/win64/vlc-$VLC-win64.zip"
          unzip -q vlc.zip -d vlc-unzipped
          mkdir -p desktop/resources/windows/vlc
          cp vlc-unzipped/vlc-$VLC/libvlc.dll vlc-unzipped/vlc-$VLC/libvlccore.dll desktop/resources/windows/vlc/
          cp -r vlc-unzipped/vlc-$VLC/plugins desktop/resources/windows/vlc/
          # Not needed for playing streams: VLC's own windows, skins and the like.
          rm -rf desktop/resources/windows/vlc/plugins/gui desktop/resources/windows/vlc/plugins/visualization
          # Also not needed: Lua scripts (web page parsing), network discovery and video walls – a smaller installer.
          rm -rf desktop/resources/windows/vlc/plugins/lua desktop/resources/windows/vlc/plugins/services_discovery desktop/resources/windows/vlc/plugins/video_splitter
          # VLC's plugin index, made now, so the first start doesn't spend half a minute looking through them.
          ./vlc-unzipped/vlc-$VLC/vlc-cache-gen.exe "$(cygpath -w "$PWD/desktop/resources/windows/vlc/plugins")" || echo "No plugin index (VLC will make one on first start)"
          ls -la desktop/resources/windows/vlc/plugins/plugins.dat || true
          du -sh desktop/resources/windows/vlc

      - name: Test the Windows app
        shell: bash
        run: gradle --no-daemon -p desktop test

      - name: Build the Windows installer
        shell: bash
        run: |
          for attempt in 1 2 3; do
            if gradle --no-daemon -p desktop packageMsi; then exit 0; fi
            echo "Build failed (attempt $attempt) – waiting a minute and trying again"
            sleep 60
          done
          exit 1

      - name: Keep the installer (download from this run's Artifacts)
        uses: actions/upload-artifact@v5
        with:
          name: tuner-windows
          path: desktop/build/compose/binaries/main/msi/*.msi

      - name: Add it to the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: desktop/build/compose/binaries/main/msi/*.msi

